[project]
name = "revops-mcp"
version = "0.1.0"
description = "Read-only MCP server that scores Salesforce renewal risk (see docs/risk-rubric.md)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
